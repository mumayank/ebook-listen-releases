<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ebook.listen — Download</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         background: #ffffff; color: #1d1d1f; display: grid; place-items: center; min-height: 100vh; }
  @media (prefers-color-scheme: dark) { body { background: #000; color: #f5f5f7; } }
  main { max-width: 640px; padding: 48px 24px; }
  h1 { font-size: 40px; letter-spacing: -0.015em; margin: 0 0 8px; }
  .dot { color: #dc143c; }
  p { color: #6e6e73; line-height: 1.5; }
  a.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; margin: 6px 8px 6px 0;
          border-radius: 12px; background: #dc143c; color: #fff; text-decoration: none; font-weight: 600; }
  a.secondary { background: #f2f2f7; color: #1d1d1f; }
  @media (prefers-color-scheme: dark) { a.secondary { background: #1c1c1e; color: #f5f5f7; } }
  code { background: #f2f2f7; padding: 2px 6px; border-radius: 6px; }
</style>
</head>
<body>
<main>
  <h1>Ebook<span class="dot">.</span>listen</h1>
  <p>Offline-first EPUB reader and local-TTS audiobook player. Everything runs on your device.</p>
  <p id="version">Checking latest version…</p>
  <p>
    <a class="btn" href="https://github.com/mumayank/ebook-listen-releases/releases/latest">Download latest</a>
    <a class="btn secondary" href="https://github.com/mumayank/ebook-listen-releases/releases">All releases</a>
  </p>
  <p>Android installs the APK directly. Desktop downloads the matching bundle. iOS updates through the App Store / TestFlight.</p>
</main>
<script>
  fetch('latest.json').then(r => r.json()).then(d => {
    document.getElementById('version').textContent = 'Latest version: ' + d.version + ' · ' + d.releasedAt;
  }).catch(() => {});
</script>
</body>
</html>
